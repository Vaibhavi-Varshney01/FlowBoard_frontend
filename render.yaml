services:
  # ─── API GATEWAY (Public Facing) ───
  - type: web
    name: flowboard-gateway
    runtime: docker
    dockerContext: ./FlowBoard/FlowBoard.Gateway
    dockerfilePath: FlowBoard/FlowBoard.Gateway/Dockerfile
    plan: starter
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: PORT
        value: 10000

  # ─── AUTH SERVICE (Private) ───
  - type: pserv
    name: flowboard-auth
    runtime: docker
    dockerContext: ./FlowBoard/FlowBoard.Auth
    dockerfilePath: FlowBoard/FlowBoard.Auth/Dockerfile
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString

  # ─── WORKSPACE SERVICE (Private) ───
  - type: pserv
    name: flowboard-workspace
    runtime: docker
    dockerContext: ./FlowBoard/FlowBoard.Workspace
    dockerfilePath: FlowBoard/FlowBoard.Workspace/Dockerfile
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString

  # ─── BOARD SERVICE (Private) ───
  - type: pserv
    name: flowboard-board
    runtime: docker
    dockerContext: ./FlowBoard/FlowBoard.Board
    dockerfilePath: FlowBoard/FlowBoard.Board/Dockerfile
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString

  # ─── COLUMN SERVICE (Private) ───
  - type: pserv
    name: flowboard-column
    runtime: docker
    dockerContext: ./FlowBoard/FlowBoard.Column
    dockerfilePath: FlowBoard/FlowBoard.Column/Dockerfile
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: RabbitMQ__Host
        value: rabbitmq

  # ─── TASK SERVICE (Private) ───
  - type: pserv
    name: flowboard-task
    runtime: docker
    dockerContext: ./FlowBoard/FlowBoard.Task
    dockerfilePath: FlowBoard/FlowBoard.Task/Dockerfile
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: RabbitMQ__Host
        value: rabbitmq

  # ─── COMMENT SERVICE (Private) ───
  - type: pserv
    name: flowboard-comment
    runtime: docker
    dockerContext: ./FlowBoard/FlowBoard.Comment
    dockerfilePath: FlowBoard/FlowBoard.Comment/Dockerfile
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString

  # ─── CHECKLIST SERVICE (Private) ───
  - type: pserv
    name: flowboard-checklist
    runtime: docker
    dockerContext: ./FlowBoard/FlowBoard.Checklist
    dockerfilePath: FlowBoard/FlowBoard.Checklist/Dockerfile
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString

  # ─── NOTIFICATION SERVICE (Private) ───
  - type: pserv
    name: flowboard-notification
    runtime: docker
    dockerContext: ./FlowBoard/FlowBoard.Notification
    dockerfilePath: FlowBoard/FlowBoard.Notification/Dockerfile
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: flowboard-db
          property: connectionString
      - key: RabbitMQ__Host
        value: rabbitmq

  # ─── RABBITMQ (Private Infrastructure) ───
  - type: pserv
    name: rabbitmq
    runtime: docker
    dockerContext: ./FlowBoard/Infrastructure
    dockerfilePath: FlowBoard/Infrastructure/RabbitMQ.Dockerfile

databases:
  - name: flowboard-db
    databaseName: flowboard
    plan: free
