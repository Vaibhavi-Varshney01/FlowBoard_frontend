<!doctype html>
<html lang="en">
  <head>
    <script>
      // Robust fix for Trusted Types - Must be first line in head
      if (window.trustedTypes && window.trustedTypes.createPolicy && !window.trustedTypes.defaultPolicy) {
        window.trustedTypes.createPolicy('default', {
          createHTML: (s) => s,
          createScriptURL: (s) => s,
          createScript: (s) => s,
        });
      }
      
      // Silence harmless AbortError from third-party media (Clerk/Turnstile)
      window.addEventListener('unhandledrejection', (event) => {
        if (event.reason && (event.reason.name === 'AbortError' || event.reason.message?.includes('play()'))) {
          event.preventDefault();
        }
      });
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowBoard</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="clerk-captcha"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
